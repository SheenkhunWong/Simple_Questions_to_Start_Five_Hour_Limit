<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>问题表 · 复制与折叠</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --surface-soft: #f4f2ec;
    --border: #e6e3da;
    --border-strong: #d8d4c8;
    --text: #1f1e1d;
    --text-mid: #4a4844;
    --text-soft: #82807a;
    --accent: #c96442;
    --accent-hover: #b3543a;
    --accent-soft: #f6e9e3;
    --green: #46a171;
    --green-soft: #e8f1ec;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 32px 28px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
  }
  .search {
    position: relative;
    flex: 1 1 300px;
    min-width: 240px;
  }
  .search svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--text-soft); pointer-events: none;
  }
  input[type="search"], select {
    width: 100%;
    height: 44px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 0 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="search"] { padding-left: 38px; -webkit-appearance: none; appearance: none; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  select {
    width: auto;
    min-width: 210px;
    padding-right: 34px;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2382807a' stroke-width='1.6'%3E%3Cpath d='M4 6.5 8 10.5 12 6.5'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 11px center;
    background-size: 15px;
  }
  input[type="search"]:focus-visible, select:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .count {
    font-size: 13.5px;
    color: var(--text-soft);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 160px;
  }
  .scroller { overflow: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
  table { width: 100%; border-collapse: collapse; }
  thead th, thead th.c-n, thead th.c-d, thead th.c-z, thead th.c-e, thead th.c-a {
    position: sticky; top: 0; z-index: 2;
    background: var(--surface-soft);
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: normal;
    line-height: 20px;
    letter-spacing: normal;
    text-transform: none;
    color: var(--text-soft);
    padding: 10px 16px;
    white-space: nowrap;
    vertical-align: middle;
  }
  tbody td {
    border-bottom: 1px solid #f0eee7;
    padding: 11px 16px;
    vertical-align: top;
    font-size: 15px;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #fbfaf6; }
  .c-n { width: 64px; }
  .c-d { width: 210px; }
  .c-z { width: 30%; }
  .c-a { width: 92px; }
  tbody td.c-n { color: var(--text-soft); font-variant-numeric: tabular-nums; font-size: 13.5px; padding-top: 13px; }
  tbody td.c-z { color: var(--text-mid); }
  tbody td.c-e { color: var(--text); }
  tbody td.c-a { text-align: left; }
  .tag {
    display: inline-block;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-mid);
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
  }
  mark { background: #fbeede; color: inherit; border-radius: 3px; padding: 0 1px; }

  .copy {
    font: inherit;
    font-size: 13.5px;
    line-height: 1;
    color: var(--text-mid);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 0 12px;
    height: 32px;
    min-width: 62px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .copy:hover { background: var(--accent-hover); border-color: var(--accent); color: #fff; }
  .copy:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .copy.done {
    background: var(--green-soft);
    border-color: #bfdccb;
    color: #2f7a52;
  }

  .empty { padding: 56px 24px; text-align: center; color: var(--text-soft); font-size: 15px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px;
    transform: translate(-50%, 14px);
    background: #2c2b28; color: #fff;
    font-size: 13.5px; line-height: 1.45;
    padding: 9px 15px; border-radius: 9px;
    max-width: min(640px, calc(100vw - 40px));
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast b { font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 860px) {
    .app { padding: 16px 18px 18px; }
    select { width: 100%; min-width: 0; }
    .count { width: 100%; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      border-bottom: 1px solid #f0eee7;
      padding: 14px 16px 12px;
      position: relative;
    }
    tbody tr:last-child { border-bottom: 0; }
    tbody td { border: 0; padding: 0 0 5px; width: auto !important; }
    tbody tr:hover td { background: transparent; }
    tbody td.c-n { display: inline-block; margin-right: 8px; padding: 0; }
    tbody td.c-d { display: inline-block; }
    tbody td.c-z { padding-top: 7px; }
    tbody td.c-a { text-align: left; padding-top: 10px; width: auto !important; }
    .copy { height: 40px; min-width: 76px; font-size: 14px; }
  }

  /* 折叠只改变可见状态，DATA 的顺序与序号始终不变。 */
  :root { --text-soft: #69665f; }
  .app > .controls, .fold-tools { flex-shrink: 0; }
  .panel { min-height: 0; }
  .copy, .action { min-height: 44px; font-size: 14px; }
  tbody td.c-n, .count, .tag, thead th { font-size: 14px; }
  .fold-tools { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .fold-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
  .fold-toggle { flex: 1; text-align: left; border: 0 !important; background: transparent !important; min-width: 150px; }
  .action { font-family: inherit; line-height: 1.4; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); color: var(--text-mid); cursor: pointer; }
  .action:hover:not(:disabled) { background: var(--surface-soft); border-color: var(--accent); }
  .action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .action:disabled { opacity: .55; cursor: not-allowed; }
  .fold-toggle::before { content: ""; display: inline-block; margin-right: 10px; border-left: 6px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
  .fold-toggle[aria-expanded="true"]::before { transform: rotate(90deg); }
  .fold-hint { margin: 0; padding: 0 16px 8px; font-size: 14px; color: var(--text-soft); }
  .fold-list { list-style: none; margin: 0; padding: 0 12px; max-height: min(220px, 27vh); overflow: auto; border-top: 1px solid var(--border); }
  .fold-item { display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .fold-item:last-child { border-bottom: 0; }
  .fold-label { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
  .fold-number { color: var(--text-soft); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .fold-item .action { flex-shrink: 0; }
  tbody tr { cursor: pointer; }
  .scroller { overflow-anchor: none; }
  [hidden] { display: none !important; }
  @media (max-width: 860px) {
    .controls { gap: 8px; margin-bottom: 8px; }
    .search { min-width: 0; flex-basis: 100%; }
    .fold-bar { padding: 6px 8px; }
    .fold-hint { padding: 0 12px 8px; }
    .copy { height: 44px; }
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191919; --surface: #202020; --surface-soft: #30302e; --border: #484844; --border-strong: #77746e; --text: #faf9f5; --text-mid: #e0ddd5; --text-soft: #b5b1a8; --accent: #efaa8e; --accent-hover: #efaa8e; --accent-soft: #48362e; }
    tbody td, tbody tr { border-bottom-color: var(--border); }
    tbody tr:hover td { background: #30302e; }
    .copy:hover { color: #191919; }
    mark { background: #674d2e; }
    @media (max-width: 860px) { tbody tr:hover td { background: transparent; } }
  }

</style>
</head>
<body>
<div class="app">
  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="q" type="search" placeholder="搜索中文、英文或序号…" aria-label="搜索问题" />
    </div>
    <select id="dom" aria-label="按领域筛选"></select>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <section class="fold-tools" aria-label="折叠管理">
    <div class="fold-bar">
      <button id="foldToggle" class="action fold-toggle" type="button" aria-expanded="false" aria-controls="foldList">已折叠 0 条</button>
      <button id="undoFold" class="action" type="button" disabled>撤销上次折叠</button>
    </div>
    <p class="fold-hint">点击条目或复制按钮，复制成功即向上收起；恢复后原顺序、原序号不变。<span id="saveStatus" role="status">折叠状态自动保存在当前浏览器。</span></p>
    <ul id="foldList" class="fold-list" aria-label="已折叠条目，可逐项取消折叠" hidden></ul>
  </section>

  <div class="panel">
    <div class="scroller" id="scroller">
      <table>
        <thead>
          <tr>
            <th class="c-n">序号</th>
            <th class="c-d">领域</th>
            <th class="c-z">中文</th>
            <th class="c-e">英文</th>
            <th class="c-a">操作</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
      <div class="empty" id="empty" hidden>没有匹配的问题，换个关键词试试。</div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

,{"n":1099,"d":"百科 / General Knowledge","z":"为什么飞机航线不是直线？","e":"Why aren't flight paths straight lines?"},{"n":1100,"d":"百科 / General Knowledge","z":"国际日期变更线是什么？","e":"What is the international date line?"},{"n":1101,"d":"百科 / General Knowledge","z":"GDP 是什么意思？","e":"What does GDP mean?"},{"n":1102,"d":"百科 / General Knowledge","z":"通货膨胀是怎么产生的？","e":"What causes inflation?"},{"n":1103,"d":"百科 / General Knowledge","z":"利率上升为什么影响股市？","e":"Why do rate hikes affect stocks?"},{"n":1104,"d":"百科 / General Knowledge","z":"汇率是怎么决定的？","e":"What determines exchange rates?"},{"n":1105,"d":"百科 / General Knowledge","z":"什么是复利？","e":"What is compound interest?"},{"n":1106,"d":"百科 / General Knowledge","z":"ETF 和基金的区别？","e":"ETFs vs mutual funds?"},{"n":1107,"d":"百科 / General Knowledge","z":"什么是供需关系？","e":"What is supply and demand?"},{"n":1108,"d":"百科 / General Knowledge","z":"为什么会有经济周期？","e":"Why do economic cycles happen?"},{"n":1109,"d":"百科 / General Knowledge","z":"区块链的基本原理？","e":"How does a blockchain work?"},{"n":1110,"d":"百科 / General Knowledge","z":"比特币为什么要挖矿？","e":"Why does Bitcoin need mining?"},{"n":1111,"d":"百科 / General Knowledge","z":"专利和商标的区别？","e":"Patents vs trademarks?"},{"n":1112,"d":"百科 / General Knowledge","z":"版权保护多久？","e":"How long does copyright last?"},{"n":1113,"d":"百科 / General Knowledge","z":"开源许可证 MIT 和 GPL 区别？","e":"MIT vs GPL licenses?"},{"n":1114,"d":"百科 / General Knowledge","z":"三权分立是什么？","e":"What is separation of powers?"},{"n":1115,"d":"百科 / General Knowledge","z":"联合国有哪些常任理事国？","e":"Who are the UN permanent members?"},{"n":1116,"d":"百科 / General Knowledge","z":"奥运会为什么四年一届？","e":"Why are the Olympics every four years?"},{"n":1117,"d":"百科 / General Knowledge","z":"诺贝尔奖有哪几个类别？","e":"What are the Nobel Prize categories?"},{"n":1118,"d":"百科 / General Knowledge","z":"公制和英制怎么换算？","e":"How do metric and imperial units convert?"},{"n":1119,"d":"百科 / General Knowledge","z":"为什么美国用华氏度？","e":"Why does the US use Fahrenheit?"},{"n":1120,"d":"百科 / General Knowledge","z":"一海里等于多少米？","e":"How many meters is a nautical mile?"},{"n":1121,"d":"百科 / General Knowledge","z":"光年是时间还是距离？","e":"Is a light-year time or distance?"},{"n":1122,"d":"百科 / General Knowledge","z":"为什么一天是 24 小时？","e":"Why does a day have 24 hours?"},{"n":1123,"d":"百科 / General Knowledge","z":"阿拉伯数字为什么叫阿拉伯数字？","e":"Why are Arabic numerals called Arabic?"},{"n":1124,"d":"百科 / General Knowledge","z":"汉字有多少个？","e":"How many Chinese characters are there?"},{"n":1125,"d":"百科 / General Knowledge","z":"世界上使用最多的语言是什么？","e":"What's the most spoken language?"},{"n":1126,"d":"百科 / General Knowledge","z":"字母表为什么是这个顺序？","e":"Why is the alphabet in that order?"},{"n":1127,"d":"百科 / General Knowledge","z":"为什么键盘是 QWERTY 排列？","e":"Why is the keyboard QWERTY?"},{"n":1128,"d":"百科 / General Knowledge","z":"红绿灯为什么用红黄绿？","e":"Why are traffic lights red, yellow, green?"},{"n":1129,"d":"百科 / General Knowledge","z":"为什么船能浮起来？","e":"Why do ships float?"},{"n":1130,"d":"百科 / General Knowledge","z":"飞机为什么能飞？一句话","e":"Why can planes fly? One line."},{"n":1131,"d":"百科 / General Knowledge","z":"电梯的钢缆断了会怎样？","e":"What happens if an elevator cable snaps?"},{"n":1132,"d":"百科 / General Knowledge","z":"微波和 5G 辐射有害吗？","e":"Are microwaves and 5G radiation harmful?"},{"n":1133,"d":"百科 / General Knowledge","z":"疫苗为什么要打两针？","e":"Why do some vaccines need two doses?"},{"n":1134,"d":"百科 / General Knowledge","z":"为什么人类需要睡眠？","e":"Why do humans need sleep?"},{"n":1135,"d":"百科 / General Knowledge","z":"安慰剂效应是什么？","e":"What is the placebo effect?"},{"n":1136,"d":"百科 / General Knowledge","z":"为什么会打哈欠传染？","e":"Why is yawning contagious?"}];
const SUFFIX = " Answer in one sentence.";

const tb = document.getElementById("tb");
const qEl = document.getElementById("q");
const domEl = document.getElementById("dom");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const scroller = document.getElementById("scroller");
const toast = document.getElementById("toast");

const domains = [];
for (const r of DATA) if (!domains.includes(r.d)) domains.push(r.d);
domEl.innerHTML =
  '<option value="">全部领域（' + DATA.length + '）</option>' +
  domains.map(function (d) {
    const n = DATA.filter(function (r) { return r.d === d; }).length;
    return '<option value="' + esc(d) + '">' + esc(d) + '（' + n + '）</option>';
  }).join("");

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function hl(s, term) {
  const t = esc(s);
  if (!term) return t;
  const safe = esc(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(safe, "gi"), function (m) { return "<mark>" + m + "</mark>"; });
}

// 用原始序号标识状态；从不重新排列或重新编号 DATA。
const folded = new Set();
const foldHistory = [];
const pending = new Set();
const byNumber = new Map(DATA.map(r => [r.n, r]));
const foldToggle = document.getElementById("foldToggle");
const foldList = document.getElementById("foldList");
const undoFold = document.getElementById("undoFold");
let shown = [];
let listOpen = false;

// 同一题库使用稳定的存储键；仅保存序号与撤销记录，不改动题库。
const STORAGE_KEY = "question-table-folds-v1-6e545cb947dd43fb";
const saveStatus = document.getElementById("saveStatus");
function storageWarning() {
  saveStatus.textContent = "当前浏览器无法保存状态；关闭后可能丢失。请使用普通浏览器窗口并允许本地存储。";
  saveStatus.style.color = "var(--accent)";
}
function loadFoldState() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (error) { storageWarning(); return; }
  if (!raw) return;
  try {
    const state = JSON.parse(raw);
    if (!state || state.version !== 1 || !Array.isArray(state.folded)) return;
    for (const n of state.folded) {
      if (Number.isInteger(n) && byNumber.has(n)) folded.add(n);
    }
    if (Array.isArray(state.history)) {
      for (const n of state.history) {
        if (folded.has(n) && !foldHistory.includes(n)) foldHistory.push(n);
      }
    }
    listOpen = state.listOpen === true;
  } catch (error) {
    // 损坏的存储不影响工具运行；下一次操作会写入有效状态。
    saveStatus.textContent = "上次保存的状态无法读取；本次操作将重新保存。";
  }
}
function saveFoldState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: 1, folded: [...folded], history: [...foldHistory], listOpen
    }));
    saveStatus.textContent = "折叠状态已自动保存在当前浏览器。";
    saveStatus.style.color = "";
  } catch (error) { storageWarning(); }
}
loadFoldState();

function matches(r) {
  const low = qEl.value.trim().toLowerCase();
  if (domEl.value && r.d !== domEl.value) return false;
  return !low || r.z.toLowerCase().includes(low) ||
    r.e.toLowerCase().includes(low) || r.d.toLowerCase().includes(low) || String(r.n) === low;
}

function renderFolded() {
  foldToggle.textContent = "已折叠 " + folded.size + " 条";
  foldToggle.setAttribute("aria-expanded", String(listOpen));
  foldList.hidden = !listOpen;
  undoFold.disabled = foldHistory.length === 0;
  foldList.innerHTML = DATA.filter(r => folded.has(r.n)).map(r =>
    '<li class="fold-item"><span class="fold-label"><span class="fold-number">#' + r.n +
    '</span>' + esc(r.z) + '</span><button class="action" type="button" data-restore="' + r.n +
    '" aria-label="取消折叠第 ' + r.n + ' 题">取消折叠</button></li>'
  ).join("") || '<li class="fold-item"><span class="fold-label">暂无已折叠条目。</span></li>';
}

function render(resetScroll = true) {
  const oldTop = scroller.scrollTop;
  // 锚定当前视口中的第一个未折叠条目，避免操作长表时跳回顶部。
  let anchor = null;
  if (!resetScroll) {
    const edge = scroller.getBoundingClientRect().top;
    const headerHeight = scroller.querySelector('thead').getBoundingClientRect().height;
    for (const tr of tb.children) {
      const rect = tr.getBoundingClientRect();
      if (!folded.has(Number(tr.dataset.n)) && rect.bottom > edge + headerHeight) {
        anchor = { n: tr.dataset.n, offset: rect.top - edge }; break;
      }
    }
  }
  const term = qEl.value.trim();
  const matched = DATA.filter(matches);
  shown = matched.filter(r => !folded.has(r.n));
  countEl.textContent = "待复制 " + shown.length + " / " + matched.length + " 条 · 已折叠 " + folded.size;
  emptyEl.hidden = shown.length > 0;
  emptyEl.textContent = matched.length ? "当前匹配条目已全部折叠，可撤销或逐项取消折叠。" : "没有匹配的问题，换个关键词试试。";
  tb.innerHTML = shown.map(r =>
    '<tr data-n="' + r.n + '" title="点击复制英文问题并折叠">' +
    '<td class="c-n">' + r.n + '</td>' +
    '<td class="c-d"><span class="tag">' + hl(r.d, term) + '</span></td>' +
    '<td class="c-z">' + hl(r.z, term) + '</td>' +
    '<td class="c-e">' + hl(r.e, term) + '</td>' +
    '<td class="c-a"><button class="copy" type="button" data-n="' + r.n +
    '" aria-label="复制第 ' + r.n + ' 题英文问题并折叠"' + (pending.has(r.n) ? ' disabled' : '') + '>' +
    (pending.has(r.n) ? '复制中' : '复制') + '</button></td></tr>'
  ).join("");
  renderFolded();
  if (resetScroll) scroller.scrollTop = 0;
  else {
    scroller.scrollTop = oldTop;
    const tr = anchor && tb.querySelector('tr[data-n="' + anchor.n + '"]');
    if (tr) scroller.scrollTop += tr.getBoundingClientRect().top - scroller.getBoundingClientRect().top - anchor.offset;
  }
}

function restore(n, undo = false) {
  if (!folded.delete(n)) return;
  // 手动恢复也移除对应撤销记录，避免撤销到已恢复项。
  for (let i = foldHistory.length - 1; i >= 0; i--) {
    if (foldHistory[i] === n) foldHistory.splice(i, 1);
  }
  saveFoldState();
  const visible = matches(byNumber.get(n));
  render(false);
  showToast((undo ? "已撤销折叠：第 " : "已取消折叠：第 ") + n + " 题，已恢复原位置" + (visible ? "。" : "；当前筛选未显示此条目。"));
}
foldToggle.addEventListener("click", () => {
  listOpen = !listOpen;
  saveFoldState();
  renderFolded();
});
undoFold.addEventListener("click", () => {
  if (foldHistory.length) restore(foldHistory[foldHistory.length - 1], true);
});
foldList.addEventListener("click", e => {
  const btn = e.target.closest("button[data-restore]");
  if (!btn) return;
  const n = Number(btn.dataset.restore);
  const items = Array.from(foldList.querySelectorAll("button"));
  const index = items.indexOf(btn);
  restore(n);
  const next = foldList.querySelectorAll("button");
  (next[Math.min(index, next.length - 1)] || foldToggle).focus({ preventScroll: true });
});

let toastTimer;
function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (resolve, reject) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    ok ? resolve() : reject();
  });
}

tb.addEventListener("click", async function (e) {
  const tr = e.target.closest("tr[data-n]");
  if (!tr || (!e.target.closest('button') && window.getSelection().toString())) return;
  const n = Number(tr.dataset.n);
  const row = byNumber.get(n);
  if (!row || folded.has(n) || pending.has(n)) return;
  const btn = tr.querySelector("button.copy");
  const keyboardFocus = document.activeElement === btn;
  const nextNumber = tr.nextElementSibling?.dataset.n || tr.previousElementSibling?.dataset.n;
  const text = row.e + SUFFIX;
  pending.add(n);
  btn.disabled = true;
  btn.textContent = "复制中";
  try {
    await copyText(text);
    folded.add(n);
    foldHistory.push(n);
    saveFoldState();
    pending.delete(n);
    // 成功后立即移出可见表格，下方条目上移；不追加到表尾。
    render(false);
    if (keyboardFocus) {
      const nextButton = nextNumber && tb.querySelector('button[data-n="' + nextNumber + '"]');
      (nextButton || undoFold).focus({ preventScroll: true });
    }
    showToast("已复制并折叠第 " + n + " 题，可撤销。");
  } catch (error) {
    pending.delete(n);
    const current = tb.querySelector('button[data-n="' + n + '"]');
    if (current) { current.disabled = false; current.textContent = "复制"; }
    showToast("复制失败，条目未折叠。请检查浏览器剪贴板权限后重试。");
  }
});

let t;
qEl.addEventListener("input", function () {
  clearTimeout(t);
  t = setTimeout(() => render(true), 120);
});
domEl.addEventListener("change", () => render(true));

render();
</script>
